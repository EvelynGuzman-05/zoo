services:
  app:
    build: .
    container_name: zoo-dev
    volumes:
      - .:/app

  db:
    image: mysql:8.4
    container_name: zoo-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: zoo
      MYSQL_USER: animal
      MYSQL_PASSWORD: animalito123
    volumes:
      - db_data:/var/lib/mysql
      - ./db/db.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: